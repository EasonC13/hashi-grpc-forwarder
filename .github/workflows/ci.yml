name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l *.go)"
      - run: go vet ./...
      - run: go test -race -timeout 90s ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
